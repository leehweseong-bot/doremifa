/* VOICE: 차분하고 실무적인 교무실 도구
   IDEA: 칠판 옆에 붙은 메뉴판 + 엑셀 같은 명렬표
   PICTURE: 반별 명렬표 칸이 나란히 선 배치판, 생활 칸에 노란 분필 음영
   COLOUR and TYPE: 칠판 초록 왼쪽 메뉴, 분필 노랑 강조, 흰 바탕 / Noto Sans KR (긍정빛클래스 메뉴와 같은 글꼴)
   LAYOUT: 왼쪽 세로 메뉴(제목·엑셀·탭), 오른쪽 작업 영역 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1513);--ink:light-dark(#15211d,#e6eee9);--mut:light-dark(#5d6964,#9aaba3);--line:light-dark(#dde4e0,#2a3631);--grid:light-dark(#c9d3ce,#34423c);--card:light-dark(#f4f7f5,#161f1c);--head:light-dark(#eef2ef,#1a2420);--board:#1e3b33;--chalk:#f2cd52;--lf:light-dark(#fff7da,#29261a);--lfh:light-dark(#fbe9a8,#3a3416);--m:light-dark(#2d6cb3,#86b6ec);--f:light-dark(#c4473f,#f19189);--bad:light-dark(#c62828,#ff7b72);--badbg:light-dark(#fdecea,#3a1c1a);--okc:light-dark(#1e5a44,#8fd3b4);--okbg:light-dark(#e3f0ea,#1c2e27)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.scroll{overflow-x:auto}
h2{font-size:23px;margin:0}
button{font-family:inherit;font-size:16px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
button.pri{background:var(--board);color:#fff;border-color:var(--board);font-weight:700}
button.big{font-size:17px;padding:0 26px}
input,select{font-size:17px;line-height:1.4;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
.hint{color:var(--mut);font-size:15px;margin:4px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}

.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:var(--board);color:#eef3ef;padding:26px 12px 20px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{text-align:center}.brand h1{font-family:"GangwonTitle","Noto Sans KR",sans-serif;font-weight:400;font-size:38px;line-height:1.05;margin:0;letter-spacing:0;font-synthesis:none}
.brand p{margin:8px 0 0;color:#bfd2c8;font-size:15px;line-height:1.45}
.sub{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:2px 0 8px 14px}
.menu .sub button{justify-content:flex-start!important}.sub i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.16);font-size:12px;margin-right:4px}
.menu .sub button{width:auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:32px;padding:0 10px;font-size:15px;font-weight:700;border-radius:8px;background:transparent;color:#e6efe9;border:1px solid rgba(255,255,255,.3)}
.menu .sub button:hover{background:rgba(255,255,255,.1)}
.menu{display:grid;gap:4px;border-top:1px solid rgba(255,255,255,.15);padding-top:16px;align-content:start}
.menu button{background:transparent;border:0;color:#cfdcd5;text-align:left;font-size:19px;font-weight:700;padding:0 14px;border-radius:10px;min-height:48px}
.menu button:hover{background:rgba(255,255,255,.06)}
.menu button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 4px 0 0 var(--chalk)}
.sidefoot{margin-top:auto;display:grid;gap:6px;font-size:14px;color:#bfd2c8}
.sidefoot p{margin:0 0 4px}
.sidefoot button{background:transparent;border:0;color:#cfdcd5;text-align:left;padding:0 4px;min-height:36px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.sidefoot #clr{color:#ffb3aa;text-decoration:none;border:1px solid rgba(255,179,170,.55);border-radius:8px;min-height:34px;padding:0 12px;font-size:15px;font-weight:700;justify-self:center}
.sidefoot #clr:hover{background:rgba(255,179,170,.12)}

.pane{padding:clamp(20px,3vw,36px) clamp(16px,2.5vw,32px)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar h2 span{font-size:16px;font-weight:500;color:var(--mut);margin-left:6px}
button.lfb{background:var(--lfh);border-color:var(--lfh);color:light-dark(#4a3a00,#f2cd52);font-weight:700}

table.grid{border-collapse:collapse;width:100%;font-size:17px;table-layout:fixed}
.pane{max-width:none}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:18px 22px;align-items:start}
.lists h3{margin:0 0 8px;font-size:19px}.lists h3 span{font-size:15px;font-weight:500;color:var(--mut);margin-left:6px}
.lists h3.M{color:var(--m)}.lists h3.F{color:var(--f)}
.thb{background:none;border:0;min-height:0;padding:4px 2px;font:inherit;font-weight:700;color:inherit;cursor:pointer;width:100%;line-height:1.25;border-radius:6px}
.thb:hover{background:rgba(0,0,0,.06)}.thb small,.grid th small{display:block;font-weight:500;color:light-dark(#7a5a00,#f2cd52);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.grid th small.p{color:var(--mut);text-decoration:none}
.grid td.c select{text-align:center}
.grid th,.grid td{border:1px solid var(--grid)}
.grid th{background:var(--head);font-weight:700;text-align:center;padding:7px 6px;white-space:nowrap;font-size:16px}
.grid td{padding:0;height:46px}
.grid input,.grid select{border:0;border-radius:0;background:transparent;width:100%;height:46px;min-height:0;padding:4px 6px;font-size:17px}
.grid input:focus,.grid select:focus{outline:2px solid var(--board);outline-offset:-2px;background:var(--bg)}
.grid td.c{text-align:center}.grid td.c input{text-align:center}
.grid .lf{background:var(--lf)}
.grid th.lf{background:var(--lfh)}
.grid select.miss{color:light-dark(#9a7a00,#f2cd52);font-weight:700}
.grid tr.newrow td:not(.lf):not(.x){background:light-dark(#fafbfa,#121a17)}
.grid tr.newrow input::placeholder{color:var(--mut)}
.grid td.x{width:34px;text-align:center;border-left-color:transparent;border-top-color:transparent;border-bottom-color:transparent;border-right-color:transparent}
.grid th.x{background:transparent;border-color:transparent}
.x{min-height:36px;padding:0 8px;color:var(--mut);background:transparent;border:0}
.empty{padding:40px 20px;text-align:center;color:var(--mut);background:var(--card);border-radius:14px;grid-column:1/-1}

.quiz{background:var(--lf);border-radius:16px;padding:clamp(16px,3vw,28px);margin:0 0 18px;border-top:5px solid var(--chalk)}
.qtop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px;color:var(--mut)}
.qtop label{display:flex;gap:6px;align-items:center}.qtop input{min-height:auto;width:20px;height:20px}
.qbar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 18px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--chalk);transition:width .3s}
.qname{font-size:clamp(28px,5vw,40px);font-weight:900;margin:0;line-height:1.1}
.qname small{font-size:16px;font-weight:500;color:var(--mut);margin-left:10px}
.qq{font-weight:700;font-size:19px;margin:22px 0 4px}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.qopts.st{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.qopts button{min-height:58px;text-align:left;padding:10px 14px;background:var(--bg);font-size:17px;line-height:1.35}
.qopts button b{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:var(--card);margin-right:10px;font-size:15px;vertical-align:middle;border:1px solid var(--line)}
.qopts button.on{border-color:var(--board);box-shadow:inset 0 0 0 2px var(--board);background:var(--okbg)}
.qopts button.on b{background:var(--board);color:#fff;border-color:var(--board)}

.pf{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.pf .memo{grid-column:1/3}
#pl{list-style:none;padding:0;margin:16px 0}
#pl li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tag{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.tag.sep{background:var(--badbg);color:var(--bad)}.tag.tog{background:var(--okbg);color:var(--okc)}

.ctl label{display:flex;gap:8px;align-items:center;font-size:17px}.ctl input{width:5em}
.sum{font-size:16px;color:var(--mut);margin:4px 0;line-height:1.8}.sum b{color:var(--ink);white-space:nowrap}
#viol p{margin:6px 0;padding:10px 14px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:16px}
#viol p.ok{background:var(--okbg);color:var(--okc)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;margin:14px 0 34px}
.col{background:var(--card);border-radius:14px;padding:10px;border-top:5px solid var(--board)}
.col header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:4px 4px 10px}
.col h3{margin:0;font-size:24px;font-weight:900}
.col header span{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.mv{width:100%;min-height:40px;background:var(--chalk);color:#2a2306;border:0;font-weight:700;margin-top:4px}
.chips{display:grid;gap:5px}
.chip{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:5px 8px 5px 10px;min-height:42px;border-radius:8px;background:var(--bg);border:1px solid var(--line);position:relative;font-size:16px}
.chip::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:2px;background:var(--mut)}
.chip.M::before{background:var(--m)}.chip.F::before{background:var(--f)}
.chip b{font-weight:500;white-space:nowrap}.chip small{color:var(--mut);font-size:13px;white-space:nowrap}
.chip i{font-style:normal;margin-left:auto;display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.chip i span{font-size:12px;padding:1px 5px;border-radius:5px;background:var(--card);color:var(--mut);white-space:nowrap}
.chip i span.w{background:light-dark(#fff3cd,#3b3210);color:light-dark(#7a5a00,#f2cd52)}
.chip i span.s{background:var(--okbg);color:var(--okc);font-weight:700}
.chip.on{outline:3px solid var(--chalk);outline-offset:1px;background:light-dark(#fffbe8,#2a2612)}
.chip.bad{border-color:var(--bad);background:var(--badbg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .lm::before{background:var(--m)}.legend .lf2::before{background:var(--f)}.legend .ln::before{display:none}
#selhint button{min-height:36px;margin-left:8px;font-size:14px}
table.stat{border-collapse:collapse;width:100%;font-size:16px}
.stat th{text-align:left;font-weight:500;color:var(--mut);border-bottom:2px solid var(--line);padding:8px 6px;white-space:nowrap}
.stat td{border-bottom:1px solid var(--line);padding:6px}
.stat .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.dlg{position:fixed;inset:0;background:rgba(10,20,16,.55);display:grid;place-items:center;padding:16px;z-index:9}
.dlg[hidden]{display:none}
.box{background:var(--bg);border-radius:16px;padding:22px;width:min(460px,100%)}
.box h3{margin:0 0 8px;font-size:21px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:38px;border:0;background:transparent;font-weight:700;border-radius:8px;padding:0 18px}
.seg button.on{background:var(--board);color:#fff}
.jseg{display:grid;grid-template-columns:1fr 1fr;padding:2px;gap:2px;border-radius:8px;min-height:36px;margin-bottom:4px}
.jlist .jseg button{min-height:0;padding:0;justify-content:center;border:0;border-radius:6px;font-size:15px;font-weight:700;background:transparent;color:var(--ink);outline:none;flex-direction:row}
.jlist .jseg button.on{background:var(--board);color:#fff;outline:none}
#ptype button[data-t=sep].on{background:var(--bad);color:#fff}#ptype button[data-t=tog].on{background:var(--okc);color:#fff}
.pbox{width:min(640px,100%);max-height:94vh;display:flex;flex-direction:column;gap:12px}
#pname,#jname{font-size:24px;margin:0}#pname small{font-size:15px;font-weight:500;color:var(--mut);margin-left:8px}
.psum{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;align-items:center}
.pcls{display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.pcls button{min-height:34px;padding:0 12px;font-size:15px;border-radius:8px}
.pcls button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px;overflow-y:auto}
.pgrid button{min-height:44px;padding:2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-size:15px;border-radius:8px;background:var(--bg)}
.pgrid button.M{border-left:4px solid var(--m)}.pgrid button.F{border-left:4px solid var(--f)}
.pgrid button small{font-size:11px;font-weight:700}
.pgrid button.sep{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pgrid button.tog{background:var(--okbg);border-color:var(--okc);color:var(--okc)}
.pt{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;min-height:0;border:0}
.pt.sep{background:var(--badbg);color:var(--bad)}.pt.tog{background:var(--okbg);color:var(--okc)}.pt.none{color:var(--mut);font-size:18px;font-weight:400}
button.pt{min-height:30px;cursor:pointer}
.grid td.pc{padding:0}
.bar .myc{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:15px;color:var(--mut)}.myc span{margin-right:4px}
.myc button{min-height:34px;padding:0 12px;font-size:15px;border-radius:8px}.myc button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu .sub button.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.6)}
.ovbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.ovmsg{font-size:15px;color:var(--mut);flex:1}.ovmsg b{color:var(--ink)}.ovn{font-size:14px;color:var(--mut)}
.ovx{min-height:30px;padding:0 10px;margin-left:8px;font-size:13px}
#ovtype button[data-ovt=sep].on{background:var(--bad);color:#fff}#ovtype button[data-ovt=tog].on{background:var(--okc);color:#fff}
.ovg{display:grid;grid-auto-flow:column;grid-auto-columns:224px;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.ovk{background:var(--cc,var(--card));border-radius:12px;padding:8px;border-top:4px solid var(--board)}
.ovk header{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 6px}.ovk header b{font-size:18px}.ovk header span{color:var(--mut);font-size:14px}

/* 편성 기준: 0 인원 · 1 남 · 2-5 학습 도레미파 · 6-9 생활 도레미파 · 10 생활지도량 · 11 생활 주5+ · 12 학습지도량 · 13 전출 예정 · 14+ 출신반 (전출 예정 학생은 13번만 셈) */
function optimize(){
  const st=S.stu,N=st.length,k=K();
  const idx=new Map(st.map((s,i)=>[s.id,i]));
  const par=st.map((_,i)=>i);const f=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};
  const sepA=st.map(()=>[]);
  for(const p of S.pairs){const a=idx.get(p.a),b=idx.get(p.b);if(a==null||b==null)continue;if(p.t==='tog')par[f(a)]=f(b);else{sepA[a].push(b);sepA[b].push(a)}}
  /* 동명이인은 자동으로 분리 */
  {const nm=new Map();st.forEach((s,i)=>{const n=String(s.name).trim();if(!n)return;if(!nm.has(n))nm.set(n,[]);nm.get(n).push(i)});nm.forEach(L=>{for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++){sepA[L[x]].push(L[y]);sepA[L[y]].push(L[x])}})}
  const um=new Map();st.forEach((s,i)=>{const r=f(i);if(!um.has(r))um.set(r,[]);um.get(r).push(i)});
  const units=[...um.values()].map(m=>{let fx=-1;for(const i of m){const v=st[i].fix;if(has(v)&&+v<k)fx=+v}return{m,fx}});
  const free=units.map((_,i)=>i).filter(i=>units[i].fx<0);
  const prevs=[...new Set(st.map(s=>String(s.cls)))],P=prevs.length,pi=new Map(prevs.map((p,i)=>[p,i]));
  const D=14+P,W=new Float64Array(D);[10,8,5,3,2,5,6,3,2,6,1.5,6,1.2,6].forEach((w,i)=>W[i]=w);for(let d=14;d<D;d++)W[d]=2;
  const feat=st.map(s=>{if(s.out)return [[13,1]];const a=[[0,1],[10,WKV[has(s.wk)?+s.wk:1]],[12,WKV[has(s.lwk)?+s.lwk:1]],[14+pi.get(String(s.cls)),1]];
    if(s.sex==='M')a.push([1,1]);if(has(s.lstg))a.push([2+(+s.lstg),1]);if(has(s.stg))a.push([6+(+s.stg),1]);if(has(s.wk)&&+s.wk===3)a.push([11,1]);return a});
  const tgt=new Float64Array(D);feat.forEach(a=>a.forEach(([d,v])=>tgt[d]+=v/k));
  let best=null,bestCost=Infinity;
  for(let r=0;r<4;r++){
    const cnt=new Float64Array(k*D),asg=new Int32Array(N).fill(-1),ua=new Int32Array(units.length),cc=new Float64Array(k);
    const addU=(u,c,sg)=>{for(const i of units[u].m){asg[i]=sg>0?c:-1;for(const [d,v] of feat[i])cnt[c*D+d]+=sg*v}if(sg>0)ua[u]=c};
    const ccost=c=>{let s=0;const o=c*D;for(let d=0;d<D;d++){const x=cnt[o+d]-tgt[d];s+=W[d]*x*x}return s};
    const sepOf=ms=>{let s=0;for(const i of ms)for(const j of sepA[i])if(asg[j]>=0&&asg[j]===asg[i])s++;return s};
    const ord=units.map((_,i)=>i).sort((a,b)=>(units[b].fx>=0)-(units[a].fx>=0)||units[b].m.length-units[a].m.length||Math.random()-.5);
    for(const u of ord){let c=units[u].fx;
      if(c<0){let bv=Infinity;for(let q=0;q<k;q++){const b0=ccost(q);addU(u,q,1);const v=ccost(q)-b0+1000*sepOf(units[u].m)+Math.random()*.01;addU(u,q,-1);if(v<bv){bv=v;c=q}}}
      addU(u,c,1)}
    for(let q=0;q<k;q++)cc[q]=ccost(q);
    const IT=Math.min(90000,6000+N*300);let T=30;const cool=Math.pow(.01/30,1/IT);
    if(free.length&&k>1)for(let it=0;it<IT;it++,T*=cool){
      const u=free[Math.random()*free.length|0],x=ua[u];
      if(Math.random()<.5){let y=Math.random()*(k-1)|0;if(y>=x)y++;
        const ms=units[u].m,b=cc[x]+cc[y]+1000*sepOf(ms);
        addU(u,x,-1);addU(u,y,1);cc[x]=ccost(x);cc[y]=ccost(y);
        const d=cc[x]+cc[y]+1000*sepOf(ms)-b;
        if(d>0&&Math.random()>=Math.exp(-d/T)){addU(u,y,-1);addU(u,x,1);cc[x]=ccost(x);cc[y]=ccost(y)}
      }else{const v=free[Math.random()*free.length|0],y=ua[v];if(y===x)continue;
        const ms=units[u].m.concat(units[v].m),b=cc[x]+cc[y]+1000*sepOf(ms);
        addU(u,x,-1);addU(v,y,-1);addU(u,y,1);addU(v,x,1);cc[x]=ccost(x);cc[y]=ccost(y);
        const d=cc[x]+cc[y]+1000*sepOf(ms)-b;
        if(d>0&&Math.random()>=Math.exp(-d/T)){addU(u,y,-1);addU(v,x,-1);addU(u,x,1);addU(v,y,1);cc[x]=ccost(x);cc[y]=ccost(y)}
      }
    }
    let tot=0;for(let q=0;q<k;q++)tot+=cc[q];tot+=500*sepOf(st.map((_,i)=>i));
    if(tot<bestCost){bestCost=tot;best=Array.from(asg)}
  }
  S.asg={};st.forEach((s,i)=>S.asg[s.id]=best[i]);
}

function range(a,dp){const r=x=>dp?Math.round(x):x;if(!a.length)return'-';const lo=r(Math.min(...a)),hi=r(Math.max(...a));return lo===hi?`${lo}`:`${lo}~${hi}`}
function cols(){const k=K(),c=Array.from({length:k},()=>[]);S.stu.forEach(s=>{const i=S.asg[s.id];if(i>=0&&i<k)c[i].push(s)});const o=S.set.ord||'name',g=s=>o==='mf'?(s.sex==='M'?0:1):o==='fm'?(s.sex==='F'?0:1):0;c.forEach(x=>x.sort((a,b)=>(!!a.out-!!b.out)||g(a)-g(b)||String(a.name).localeCompare(String(b.name),'ko')));return c}

    if(p.t==='sep'&&ca===cb&&ca>=0&&ca<k){vl.push(`분리 조건 위반: ${esc(a.name)} · ${esc(b.name)} (${cname(ca)})`);bad.add(a.id);bad.add(b.id)}

  {const seen=new Map();st.forEach(s=>{const c=S.asg[s.id];if(!(c>=0&&c<k))return;const key=c+'|'+String(s.name).trim();if(seen.has(key)){const o=seen.get(key);vl.push(`동명이인이 같은 반: ${esc(s.name)} (${cname(c)})`);bad.add(o.id);bad.add(s.id)}else seen.set(key,s)})}
  st.forEach(s=>{if(has(s.fix)&&+s.fix<k&&S.asg[s.id]!==+s.fix){vl.push(`고정과 다름: ${esc(s.name)} → 고정 ${cname(+s.fix)}`);bad.add(s.id)}});
  if(un.length)vl.push(`아직 반이 없는 학생 ${un.length}명 (${un.slice(0,5).map(s=>esc(s.name)).join(', ')}${un.length>5?' 외':''}) — 자동 편성을 다시 눌러 주세요`);
  $('#viol').innerHTML=vl.map(v=>`<p>${v}</p>`).join('');
  const sS=sel!=null?B[sel]:null;if(!sS)sel=null;
  const prevs=[...new Set(st.map(s=>String(s.cls)))].sort((a,b)=>num(a)-num(b)||a.localeCompare(b));
  const pm=id=>{const L=pairsOf(id);const n1=L.filter(x=>x.t==='sep').length,n2=L.length-n1;return (n1?`<em class="sep">분${n1>1?n1:''}</em>`:'')+(n2?`<em class="tog">동${n2>1?n2:''}</em>`:'')};
  const row=(s,j)=>`<button class="ovs rs ${s.sex}${s.out?' out':''}${s.id===sel?' on':''}${bad.has(s.id)?' bad':''}" style="--rc:${ccOf(s.cls)}" data-id="${s.id}" title="${esc(s.cls)}반 ${esc(s.no)}번"><span>${j+1}</span><b>${esc(s.name)}</b><i>${has(s.lstg)?STG[+s.lstg]:'·'}</i><i>${has(s.stg)?STG[+s.stg]:'·'}</i><u>${has(s.fix)?'<em class="fx">고정</em>':''}${pm(s.id)}</u><small>${esc(s.cls)}</small></button>`;
  box.innerHTML=`<div class="ovg">${C.map((c,i)=>{const n=c.filter(s=>!s.out),m=n.filter(s=>s.sex==='M').length,o=c.length-n.length,can=sS&&S.asg[sel]!==i;
    const pv={};n.forEach(s=>pv[s.cls]=(pv[s.cls]||0)+1);
    return `<section class="ovk"><header><b>${cname(i)}</b><span>${n.length}명${o?` +전출${o}`:''} · 남${m} 여${n.length-m}</span></header>${can?`<button class="mv" data-mv="${i}">${esc(sS.name)} 여기로</button>`:''}${sS&&S.asg[sel]===i?`<button class="mv fx" data-fix="1">${has(sS.fix)?'고정 풀기':esc(sS.name)+' 이 반에 고정'}</button>`:''}<div class="ovl">${c.map(row).join('')}</div>

  if(el.value&&!tr.dataset.new){const s=S.stu.find(x=>x.id===+tr.dataset.id);if(s){setSel(s,'ac',el.value);save()}moveRow(el,1)}});
$('#lists').addEventListener('keydown',e=>{const el=e.target;if(!el.dataset||!el.dataset.f||el.tagName!=='INPUT')return;
  if(e.key==='Enter'||e.key==='ArrowDown'){if(moveRow(el,1))e.preventDefault()}else if(e.key==='ArrowUp'){if(moveRow(el,-1))e.preventDefault()}});
$('#lists').addEventListener('click',e=>{const j=e.target.closest('[data-judge]');if(j)return judgeOpen(j.dataset.judge,j.dataset.jm);const jb=e.target.closest('[data-jid]');if(jb){const x=S.stu.find(z=>z.id===+jb.dataset.jid);return judgeOpen(x&&x.sex,jb.dataset.jm,+jb.dataset.jid)}const pr=e.target.closest('[data-pair]');if(pr)return pairOpen(+pr.dataset.pair);const ob=e.target.closest('[data-out]');if(ob){const x=S.stu.find(z=>z.id===+ob.dataset.out);if(x){x.out=!x.out;save();renderList();toast(x.out?`${x.name}: 전출 예정`:`${x.name}: 전출 예정 취소`)}return}const d=e.target.closest('[data-del]');if(!d)return;const id=+d.dataset.del;S.stu=S.stu.filter(s=>s.id!==id);S.pairs=S.pairs.filter(p=>p.a!==id&&p.b!==id);delete S.asg[id];save();renderList()});
$('#jx').addEventListener('click',judgeClose);
$('#jlist').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;clearTimeout(jt);jsex=b.dataset.g;const L=jOrder();const f=L.find(s=>!jDone(s))||L[0];jsel=f?f.id:null;renderJudge()});
$('#px').addEventListener('click',pairClose);
$('#pairdlg').addEventListener('click',e=>{if(e.target.id==='pairdlg')return pairClose();const t=e.target.closest('[data-t]');if(t){ptype=t.dataset.t;return renderPair()}const c=e.target.closest('[data-c]');if(c){pcls=c.dataset.c;return renderPair()}const o=e.target.closest('[data-o]');if(o)return pairToggle(+o.dataset.o);const r=e.target.closest('[data-rm]');if(r){const x=+r.dataset.rm;S.pairs=S.pairs.filter(p=>!((p.a===pid&&p.b===x)||(p.a===x&&p.b===pid)));save();renderPair();renderHead()}});
$('#judge').addEventListener('click',e=>{if(e.target.id==='judge')judgeClose()});
$('#jlist').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;clearTimeout(jt);jsel=+b.dataset.j;renderJudge()});
$('#qwk').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b)judgePick('wk',+b.dataset.w)});
$('#qstg').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)judgePick('stg',+b.dataset.s)});
$('#k').addEventListener('change',e=>{S.set.k=Math.max(2,Math.min(14,+e.target.value||2));save();renderHead();renderResult()});
$('#lab').addEventListener('change',e=>{S.set.label=e.target.value;save();renderResult()});
$('#ord').addEventListener('change',e=>{S.set.ord=e.target.value;save();renderResult()});
$('#go').addEventListener('click',()=>{if(!S.stu.length)return toast('먼저 명단을 넣어 주세요');const b=$('#go');b.disabled=true;b.textContent='편성 중…';setTimeout(()=>{if(Object.keys(S.asg).length)undo.push(JSON.stringify(S.asg));optimize();sel=null;save();renderResult();b.disabled=false;b.textContent='다시 편성';toast('편성을 마쳤어요')},30)});
$('#und').addEventListener('click',()=>{if(!undo.length)return;S.asg=JSON.parse(undo.pop());sel=null;save();renderResult();toast('한 단계 되돌렸어요')});
$('#board').addEventListener('click',e=>{if(!e.target.closest('[data-fix]')||sel==null)return;e.stopImmediatePropagation();const s=S.stu.find(x=>x.id===sel);if(!s)return;if(has(s.fix)){s.fix='';toast('고정을 풀었어요')}else{s.fix=S.asg[s.id];toast(`${cname(S.asg[s.id])}에 고정했어요. 다시 편성해도 이 반에 남아요`)}save();renderResult()});
$('#board').addEventListener('click',e=>{
  if(e.target.closest('[data-fix]'))return;const mv=e.target.closest('[data-mv]');
  if(mv&&sel!=null){undo.push(JSON.stringify(S.asg));S.asg[sel]=+mv.dataset.mv;sel=null;save();renderResult();return}
  const c=e.target.closest('.ovs');if(!c)return;const id=+c.dataset.id;
  if(sel===id)sel=null;
  else if(sel!=null&&S.asg[sel]!==S.asg[id]){undo.push(JSON.stringify(S.asg));const t=S.asg[sel];S.asg[sel]=S.asg[id];S.asg[id]=t;sel=null;save();toast('두 학생을 맞바꿨어요')}
  else sel=id;
  renderResult()});
$('#clr').addEventListener('click',()=>ask('모든 자료를 지울까요?','명단, 조건, 편성 결과가 이 기기에서 모두 지워집니다. 먼저 엑셀로 내려받아 두는 것을 권해요.',[['지우기','y','pri'],['취소','','']],v=>{if(!v)return;S={set:{k:6,label:'num',tab:'list'},stu:[],pairs:[],asg:{},nextId:1};undo=[];sel=null;try{localStorage.removeItem(KEY)}catch(x){}renderList();setTab('list');toast('모든 자료를 지웠어요')}));
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#dlg').hidden)$('#dlg').hidden=true;else if(!$('#up').hidden)upClose();else if(!$('#judge').hidden)judgeClose();else if(!$('#pairdlg').hidden)pairClose()});
}
</script>
</body></html>
